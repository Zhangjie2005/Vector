function chooseEdges(){if(mode==='local')return data.edges.filter(e=>e.paper_id===paperSel.value);
 let selected=[];for(const pid of Object.keys(data.papers).sort())for(const type of ['PROPOSES','USES_INPUT','ADDRESSES_TASK']){let row=data.edges.find(e=>e.paper_id===pid&&e.type===type);if(row)selected.push(row)}return selected}
function coordinates(ids,es){let arr=ids.map(id=>({...nodeMap[id],x:80+(hash(id)%1040),y:60+(hash(id+'x')%540),vx:0,vy:0}));let by=Object.fromEntries(arr.map(n=>[n.id,n]));
 for(let t=0;t<150;t++){for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++){let a=arr[i],b=arr[j],dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+50,force=2400/d2;a.vx+=dx*force/Math.sqrt(d2);a.vy+=dy*force/Math.sqrt(d2);b.vx-=dx*force/Math.sqrt(d2);b.vy-=dy*force/Math.sqrt(d2)}for(const e of es){let a=by[e.source],b=by[e.target],dx=b.x-a.x,dy=b.y-a.y,dist=Math.sqrt(dx*dx+dy*dy)+.001,f=(dist-100)*.003;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f}for(const a of arr){a.vx+=(600-a.x)*.0005;a.vy+=(330-a.y)*.0005;a.x=Math.max(35,Math.min(1165,a.x+a.vx));a.y=Math.max(35,Math.min(625,a.y+a.vy));a.vx*=.67;a.vy*=.67}}return arr}
function hash(s){let h=0;for(let c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}
function el(name,attrs){let e=document.createElementNS('http://www.w3.org/2000/svg',name);for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e}
function render(){graphEdges=chooseEdges();let ids=[...new Set(graphEdges.flatMap(e=>[e.source,e.target]))];graphNodes=coordinates(ids,graphEdges);let by=Object.fromEntries(graphNodes.map(n=>[n.id,n]));svg.innerHTML='';let g=el('g',{transform:`translate(${view.x} ${view.y}) scale(${view.k})`});svg.appendChild(g);
 for(const e of graphEdges){let a=by[e.source],b=by[e.target];let l=el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:'edge'});l.addEventListener('click',ev=>{ev.stopPropagation();showEdge(e)});g.appendChild(l)}
 for(const n of graphNodes){let c=el('circle',{cx:n.x,cy:n.y,r:n.category==='Paper'?9:n.category==='Method'?7:5,fill:colors[n.category]||'#ed9341',class:'node'});c.addEventListener('click',ev=>{ev.stopPropagation();showNode(n)});g.appendChild(c);if(n.category==='Paper'||n.category==='Method'){let t=el('text',{x:n.x+10,y:n.y-8,class:'label'});t.textContent=n.name.length>24?n.name.slice(0,23)+'…':n.name;g.appendChild(t)}}
 if(selected)selected();}
function showNode(n){info.innerHTML='<h2>节点：'+esc(n.name)+'</h2>'+Object.entries(n).filter(([k])=>!['x','y','vx','vy'].includes(k)).map(([k,v])=>`<div class="prop"><span class="key">${esc(k)}</span>${esc(v)}</div>`).join('')}
function showEdge(e){let a=nodeMap[e.source],b=nodeMap[e.target];info.innerHTML=`<h2>关系：${esc(e.raw_predicate)}</h2><p>${esc(a.name)} → ${esc(b.name)}</p>`+Object.entries(e).filter(([k])=>!['source','target'].includes(k)).map(([k,v])=>`<div class="prop"><span class="key">${esc(k)}</span>${k==='source_url'?`<a target="_blank" rel="noopener noreferrer" href="${esc(v)}">打开论文原文</a>`:esc(v)}</div>`).join('')}
function reset(){view={x:0,y:0,k:1};selected=null;render();info.innerHTML='<h2>图谱说明</h2><p>点击节点或关系查看属性与来源。当前显示 '+graphNodes.length+' 个节点、'+graphEdges.length+' 条关系。</p>'}
document.getElementById('overview').onclick=()=>{mode='overview';document.getElementById('overview').classList.add('active');document.getElementById('local').classList.remove('active');reset()};
document.getElementById('local').onclick=()=>{mode='local';document.getElementById('local').classList.add('active');document.getElementById('overview').classList.remove('active');reset()};
paperSel.onchange=()=>{mode='local';document.getElementById('local').classList.add('active');document.getElementById('overview').classList.remove('active');reset()};
document.getElementById('reset').onclick=reset;search.oninput=()=>{let q=search.value.trim().toLowerCase();if(!q){reset();return}let n=graphNodes.find(n=>n.name.toLowerCase().includes(q));if(n)showNode(n);else info.innerHTML='<h2>未在当前视图找到节点</h2><p>可换一篇论文，或缩短搜索词。</p>'};
svg.onwheel=e=>{e.preventDefault();view.k=Math.max(.5,Math.min(3,view.k*(e.deltaY<0?1.12:.89)));render()};svg.onpointerdown=e=>{if(e.target===svg){drag={x:e.clientX,y:e.clientY};svg.setPointerCapture(e.pointerId)}};svg.onpointermove=e=>{if(drag){view.x+=(e.clientX-drag.x)*1200/svg.clientWidth;view.y+=(e.clientY-drag.y)*660/svg.clientHeight;drag={x:e.clientX,y:e.clientY};render()}};svg.onpointerup=()=>drag=null;reset();
</script></body></html>
